spring.application.name=DASHBOARD-MANAGEMENT

server.port=9999

#Database configuration
spring.datasource.url= ${SPRING_DATASOURCE_URL: }
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Eselase12/.}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.session.jdbc.initialize-schema=always
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernatw.format_sql=${HIBERNATE_FORMAT:true}
server.servlet.session.timeout=${SESSION_TIMEOUT:20m}

# Optional settings for connection pool
#spring.datasource.hikari.maximum-pool-size=10
#spring.datasource.hikari.minimum-idle=2
#spring.datasource.hikari.idle-timeout=30000
#spring.datasource.hikari.connection-timeout=20000
#spring.datasource.hikari.pool-name=OraclePool

#MAIL CONFIGURATION
spring.mail.host=${SPRING_MAIL_HOST:smtp.example.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:default_email@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:default_password}
spring.mail.protocol=${SPRING_MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.auth= ${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITEOUT:5000}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL:true}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_TRUST:smtp.gmail.com}
spring.mail.properties.mail.debug=${SPRING_MAIL_SMTP_DEBUG:true}


#Security
spring.security.user.name= ${SPRING_USERNAME:admin}
spring.security.user.password=${SPRING_PASSWORD:1234}
logging.level.org.springframework.security = ${SPRING_SECURITY_LOG_LEVEL:ERROR}


logging.pattern.console= ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

logging.level.org.nobleson = debug

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
# Set the maximum allowed request size in bytes
spring.servlet.multipart.max-request-size=100MB

#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8080/realms/payrollsystem/protocol/openid-connect/certs}
spring.profiles.active = default

#spring.config.activate.on-profile= prod

#CLOUDINARY CONFIGURATION
cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


spring.main.allow-circular-references=true
